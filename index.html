<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Estilo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo.css">


</head>
<body>
    
    <header>
        <div id="menuPrincipal">
            <img src="./img/Logo.png" alt="" class="logo">
            <div id="buscador">
                <form action="#" method="get">
                    <input type="text" name="buscador" id="busca">
                    <button type="button" class="boton_buscar"><img src="./img/search.svg" alt="buscar" class="imagen_buscar"></button>
                </form>
            </div>
            <div id="usuario">
                <img src="./img/person.svg" alt="" class="imagen_usuario">
                <a href="#" class="inicio_sesion">Inicio Sesion</a>
            </div>
            <div id="compra">
                <a href="#"><img src="./img/shopping_cart.svg" alt="carrito" class="imagen_carrito"></a>
            </div>
        </div>
        <div class="enlaces">
            <nav>
                <a href="#" class="a_enlaces">Mujer</a>
                <a href="#" class="a_enlaces">Hombre</a>
                <a href="#" class="a_enlaces">Niño/a</a>
                <a href="#" class="a_enlaces">Accesorios</a>
                <a href="#" class="a_enlaces">Otros</a>
            </nav>
        </div>
    </header>
    <main>
        <div id="banner">
            <h1 class="texto_banner">Las mejores Prendas para vestir</h1>
        </div>
        <div id="novedades">
            <h2 class="texto_novedades">Novedades</h2>
            <div id="novedades_productos">
                <div class="productos">
                    <img src="./img/Ropa_1.png" alt="ropa" class="imagenes_productos">
                    <div class="texto_descripcionSimple">
                        <p class="texto_producto">Vestido</p>
                        <p class="texto_precio">0.00$</p>
                    </div>
                </div>

                <div class="productos">
                    <img src="./img/Ropa_1.png" alt="ropa" class="imagenes_productos">
                    <div class="texto_descripcionSimple">
                        <p class="texto_producto">Vestido</p>
                        <p class="texto_precio">0.00$</p>
                    </div>
                </div>
                
                <div class="productos">
                    <img src="./img/Ropa_1.png" alt="ropa" class="imagenes_productos">
                    <div class="texto_descripcionSimple">
                        <p class="texto_producto">Vestido</p>
                        <p class="texto_precio">0.00$</p>
                    </div>
                </div>
                
                <div class="productos">
                    <img src="./img/Ropa_1.png" alt="ropa" class="imagenes_productos">
                    <div class="texto_descripcionSimple">
                        <p class="texto_producto">Vestido</p>
                        <p class="texto_precio">0.00$</p>
                    </div>
                </div>

               
            </div>
        </div>
    </main>
    <footer>
        <div id="redes">
            <a href="#"><img src="./img/Facebook.png" alt="" class="imagenes_redes"></a>
            <a href="#"><img src="./img/Instagram.png" alt="" class="imagenes_redes"></a>
            <a href="#"><img src="./img/TikTok.png" alt="" class="imagenes_redes"></a>
        </div>
        <div id="masEnlaces">
            <div class="enlaces_footer">
                <a href="#" >Sobre Nosotros</a>
            </div>
            <div class="enlaces_footer">
                <a href="#" >Terminos y Condiciones</a>
            </div>
            <div class="enlaces_footer">

</html>
