<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Comprar</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
   <header>
        <div id="menuPrincipal">
            <a href="./index.html"><img src="./img/Logo.png" alt="logo" class="logo"></a>
            <div id="buscador">
                <form action="#" method="get">
                    <input type="text" name="buscador" id="busca">
                    <button type="button" class="boton_buscar"><img src="./img/search.svg" alt="buscar" class="imagen_buscar"></button>
                </form>
            </div>
            <div id="usuario">
                <a href="./sesion.html" class="inicio_sesion">
                    <img src="./img/person.svg" alt="" class="imagen_usuario">
                    Inicio<br>Sesion
                </a>
            </div>
            <div id="compra">
                <a href="./comprar.html" class="carrito"><img src="./img/shopping_cart.svg" alt="carrito" class="imagen_carrito"></a>
            </div>
        </div>
        <div class="enlaces">
            <nav>
                <a href="./lista-productos.html" class="a_enlaces">Mujer</a>
                <a href="./lista-productos.html" class="a_enlaces">Hombre</a>
                <a href="./lista-productos.html" class="a_enlaces">Niño/a</a>
                <a href="./lista-productos.html" class="a_enlaces">Accesorios</a>
                <a href="./lista-productos.html" class="a_enlaces">Otros</a>
            </nav>
        </div>
    </header>
   <main>
        <section class="compra">
            <form action="#" method="POST">
                    <h2>Pedido</h2>
                    <label for="direccion">Dirección<br>
                        <input type="text" name="direccion">
                    </label> <br> <br>
                    <label for="tarjeta">Número de tarjeta <br>
                        <input type="text" name="tarjeta">
                    </label> <br> <br>
                    <label for="productos">Productos seleccionados<br>
                        <input type="text" name="productos">
                    </label> <br> <br>
                    <label for="precio_total"> Total:
                        <p style="display: inline-block;" id="precio_total" id="precio"> $</p>
                    </label> <br> <br> 
                    <input type="button" value="Comprar">
                     <br> <br> 
            </form>
        </section>
   </main>
   <footer>
        <div id="redes">
            <a href="#"><img src="./img/Facebook.png" alt="" class="imagenes_redes"></a>
            <a href="#"><img src="./img/Instagram.png" alt="" class="imagenes_redes"></a>
            <a href="#"><img src="./img/TikTok.png" alt="" class="imagenes_redes"></a>
        </div>
        <div id="masEnlaces">
            <div class="enlaces_footer">
                <a href="./sobreNosotros.html" >Sobre Nosotros</a>
            </div>
            <div class="enlaces_footer">
                <a href="#" >Terminos y Condiciones</a>
            </div>
            <div class="enlaces_footer">
                <a href="#" >Ayuda</a>
            </div>
        </div>
    </footer>

</html>
