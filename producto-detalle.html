<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto-detalle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
    <header>
        <div id="menuPrincipal">
            <img src="./img/Logo.png" alt="logo" class="logo">
            <div id="buscador">
                <form action="#" method="get">
                    <input type="text" name="buscador" id="busca">
                    <button type="button" class="boton_buscar"><img src="./img/search.svg" alt="buscar" class="imagen_buscar"></button>
                </form>
            </div>
            <div id="usuario">
                <a href="#" class="inicio_sesion">
                    <img src="./img/person.svg" alt="" class="imagen_usuario">
                    Inicio<br>Sesion
                </a>
            </div>
            <div id="compra">
                <a href="#" class="carrito"><img src="./img/shopping_cart.svg" alt="carrito" class="imagen_carrito"></a>
            </div>
        </div>
        <div class="enlaces">
            <nav>
                <a href="#" class="a_enlaces">Mujer</a>
                <a href="#" class="a_enlaces">Hombre</a>
                <a href="#" class="a_enlaces">Niño/a</a>
                <a href="#" class="a_enlaces">Accesorios</a>
                <a href="#" class="a_enlaces">Otros</a>
            </nav>
        </div>
    </header>
    <main>

        <div id="producto_detalle">
            <div class="producto_imagen_detalle">
                <img src="./img/Ropa_1.png" alt="ropa" class="producto_imagen">
            </div>
            <div class="texto_producto_descripcion">
                <p class="texto_titulo_producto">Vestido de otoño</p>
                <p class="texto_descripcion">Marca: Stradivarius
                    Tamaño: L
                    Estado: Nuevo sin etiquetas
                    Material: Terciopelo
                </p>
                <p class="texto_precio_producto">0.00$</p>
            </div>
        </div>

        <div id="recomendado">
            <p class="texto_recomendado">Recomendado</p>
            <div id="recomendado_productos">
                <div class="productos">
                    <img src="./img/Ropa_1.png" alt="ropa" class="imagenes_productos">
                    <div class="texto_descripcionSimple">
                        <p class="texto_producto">Vestido</p>
                        <p class="texto_precio">0.00$</p>
                    </div>
                </div>

                <div class="productos">
                    <img src="./img/Ropa_1.png" alt="ropa" class="imagenes_productos">
                    <div class="texto_descripcionSimple">
                        <p class="texto_producto">Vestido</p>
                        <p class="texto_precio">0.00$</p>
                    </div>
                </div>

                <div class="productos">
                    <img src="./img/Ropa_1.png" alt="ropa" class="imagenes_productos">
                    <div class="texto_descripcionSimple">
                        <p class="texto_producto">Vestido</p>
                        <p class="texto_precio">0.00$</p>
                    </div>
                </div>

                <div class="productos">
                    <img src="./img/Ropa_1.png" alt="ropa" class="imagenes_productos">
                    <div class="texto_descripcionSimple">
                        <p class="texto_producto">Vestido</p>
                        <p class="texto_precio">0.00$</p>
                    </div>
                </div>

                <div class="productos">
                    <img src="./img/Ropa_1.png" alt="ropa" class="imagenes_productos">
                    <div class="texto_descripcionSimple">
                        <p class="texto_producto">Vestido</p>
                        <p class="texto_precio">0.00$</p>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <footer>
        <div id="redes">
            <a href="#"><img src="./img/Facebook.png" alt="" class="imagenes_redes"></a>
            <a href="#"><img src="./img/Instagram.png" alt="" class="imagenes_redes"></a>
            <a href="#"><img src="./img/TikTok.png" alt="" class="imagenes_redes"></a>
        </div>
        <div id="masEnlaces">
            <div class="enlaces_footer">
                <a href="#" >Sobre Nosotros</a>
            </div>
            <div class="enlaces_footer">
                <a href="#" >Terminos y Condiciones</a>
            </div>
            <div class="enlaces_footer">
                <a href="#" >Ayuda</a>
            </div>
        </div>
    </footer>
</body>
</html>
